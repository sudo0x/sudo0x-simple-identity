apiVersion: v1
kind: Pod
metadata:
  name: {{ include "identity-service.fullname" . }}-test
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "identity-service.labels" . | nindent 4 }}
    helm.sh/chart: {{ include "identity-service.chart" . }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534   # nobody
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: health-check
      # Uses busybox wget — available in standard Kubernetes environments
      image: busybox:1.36
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      command:
        - sh
        - -c
        - |
          set -e
          BASE_URL="http://{{ include "identity-service.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"

          echo "=== Testing Identity Service health ==="

          echo "--- Checking liveness endpoint ---"
          wget -q -O - "${BASE_URL}/actuator/health/liveness" | grep -q '"status":"UP"'
          echo "Liveness: OK"

          echo "--- Checking readiness endpoint ---"
          wget -q -O - "${BASE_URL}/actuator/health/readiness" | grep -q '"status":"UP"'
          echo "Readiness: OK"

          echo "--- Checking JWKS endpoint ---"
          wget -q -O - "${BASE_URL}/.well-known/jwks.json" | grep -q '"keys"'
          echo "JWKS: OK"

          echo "=== All checks passed ==="
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
