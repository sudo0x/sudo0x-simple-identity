version: "3.9"

services:

  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: identity-postgres
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: ${DATABASE_USER:-identity}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-identity}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-identity} -d identity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - identity-net

  # ─── Identity Service ────────────────────────────────────────────────────────
  identity-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: identity-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: jdbc:postgresql://postgres:5432/identity
      DATABASE_USER: ${DATABASE_USER:-identity}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-identity}
      JWT_ISSUER: identity-service
      JWT_PRIVATE_KEY_LOCATION: generate
      JWT_PUBLIC_KEY_LOCATION: generate
      SEED_ENABLED: ${SEED_ENABLED:-true}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@1234!}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - identity-net
    restart: unless-stopped

  # ─── MailHog (local email catching — optional) ────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: identity-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - identity-net
    profiles:
      - mail           # Only starts with: docker compose --profile mail up

volumes:
  postgres_data:

networks:
  identity-net:
    driver: bridge
