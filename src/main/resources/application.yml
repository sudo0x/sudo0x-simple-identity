spring:
  application:
    name: identity-service
  profiles:
    default: local


  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/identity}
    username: ${DATABASE_USER:identity}
    password: ${DATABASE_PASSWORD:identity}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    default-property-inclusion: non_null

# ===========================
# Identity Service Properties
# ===========================
identity:
  jwt:
    issuer: ${JWT_ISSUER:identity-service}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:PT15M}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:P30D}
    # Set to 'generate' in local/test; set to a classpath or file: path in production
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION:generate}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:generate}

  security:
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    lock-duration: ${ACCOUNT_LOCK_DURATION:PT15M}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: "*"
      max-age: 3600

  password:
    minimum-length: ${PASSWORD_MIN_LENGTH:8}
    require-uppercase: ${PASSWORD_REQUIRE_UPPERCASE:true}
    require-lowercase: ${PASSWORD_REQUIRE_LOWERCASE:true}
    require-digit: ${PASSWORD_REQUIRE_DIGIT:true}
    require-special: ${PASSWORD_REQUIRE_SPECIAL:false}

  email:
    verification-token-expiration: ${EMAIL_VERIFICATION_EXPIRY:PT24H}
    reset-token-expiration: ${PASSWORD_RESET_EXPIRY:PT1H}
    verification-required: ${EMAIL_VERIFICATION_REQUIRED:false}

  seed:
    enabled: ${SEED_ENABLED:false}
    admin-username: ${SEED_ADMIN_USERNAME:admin}
    admin-email: ${SEED_ADMIN_EMAIL:admin@localhost}
    admin-password: ${SEED_ADMIN_PASSWORD:}

  # ─── Cookie-based authentication (for browser SPA / SSR clients) ─────────
  # When enabled, login/refresh responses also set HttpOnly cookies.
  # The JWT filter checks both Authorization header AND cookies.
  # Tokens are still returned in the JSON body for API clients.
  cookie:
    enabled: ${COOKIE_AUTH_ENABLED:false}
    secure: ${COOKIE_SECURE:true}
    http-only: true
    same-site: ${COOKIE_SAME_SITE:Lax}
    domain: ${COOKIE_DOMAIN:}
    path: /
    access-token-name: access_token
    refresh-token-name: refresh_token

# ===========================
# Actuator
# ===========================
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: identity-service
    version: '@project.version@'

# ===========================
# Server
# ===========================
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json

spring.lifecycle.timeout-per-shutdown-phase: 30s

# ===========================
# OpenAPI / Swagger
# ===========================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: false


