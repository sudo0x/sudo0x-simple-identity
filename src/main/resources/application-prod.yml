spring:
  jpa:
    show-sql: false

identity:
  seed:
    enabled: false
  jwt:
    # In production, point to mounted key files or secrets-manager-injected paths
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,metrics

logging:
  level:
    root: WARN
    com.sudo0x.simple.identity: INFO
